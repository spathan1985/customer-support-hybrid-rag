[project]
name = "customer-support-rag"
version = "0.1.0"
description = "A Streamlit customer-support assistant using hybrid retrieval, reranking, and evidence-grounded generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters>=1.0,<2",
    "openai>=2.0,<4",
    "pinecone>=7.0,<11",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "rank-bm25==0.2.2",
    "streamlit>=1.40,<2",
]

[tool.uv]
package = false
